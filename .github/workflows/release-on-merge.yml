name: Release on merge

# Merging with "(RELEASE)" anywhere in the commit subject ships whatever
# version Cargo.toml names. The build itself lives in release.yml, which
# already resolves that version, refuses to rebuild a published one, and can
# run without a tag — so this workflow only decides *whether* to start it.

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start a release
    if: contains(github.event.head_commit.message, '(RELEASE)')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # Sparkle shows the CHANGELOG section matching the version being
      # released, so a version with no section ships an empty update prompt to
      # everyone. Failing here costs a re-push; failing silently costs a
      # release.
      - name: Check the changelog names this version
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Rename the [unreleased] heading to [$version] before releasing."
            exit 1
          fi
          notes=$(awk -v v="## [$version]" '
            $0 == v { collecting = 1; next }
            collecting && /^## / { exit }
            collecting && NF { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::The '## [$version]' section is empty. Sparkle would show an empty update prompt."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh workflow run release.yml --ref "${GITHUB_REF_NAME}"
          echo "Dispatched release.yml for ${VERSION}."
