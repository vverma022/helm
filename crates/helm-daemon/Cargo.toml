[package]
name = "helm-daemon"
version = "0.1.0"
edition = "2024"
description = "Headless Helm provider daemon"
license = "GPL-3.0-only"
readme = "README.md"

[features]
dev-binary = []

[[bin]]
name = "helm-daemon"
path = "src/main.rs"

[[bin]]
name = "helm-debug-daemon"
path = "src/bin/helm-debug-daemon.rs"
required-features = ["dev-binary"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
helm-core = { path = "../helm-core" }
helm-protocol = { path = "../helm-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
